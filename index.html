<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD de automóviles</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Registro de automóviles</h1>

    <form id="formulario-auto" class="formulario">
      <input type="hidden" id="auto-id">

      <label for="marca">Marca</label>
      <input type="text" id="marca" required>

      <label for="modelo">Modelo</label>
      <input type="text" id="modelo" required>

      <label for="anio">Año</label>
      <input type="number" id="anio" min="1900" required>

      <label for="color">Color</label>
      <input type="text" id="color" required>

      <div class="botones">
        <button type="submit" id="boton-guardar">Guardar auto</button>
        <button type="button" id="boton-cancelar" class="oculto">Cancelar</button>
      </div>
    </form>

    <section>
      <h2>Automóviles registrados</h2>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Marca</th>
              <th>Modelo</th>
              <th>Año</th>
              <th>Color</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="lista-autos"></tbody>
        </table>
      </div>
      <p id="mensaje-vacio">No hay automóviles registrados.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
